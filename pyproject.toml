[project]
name = "japan-visa-fillable-templates"
version = "0.1.0"
description = "Interactive fillable PDF templates for Japan Working Holiday Visa applications."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "reportlab>=4.0.0",
]

[project.scripts]
generate-resume = "japan_visa_fillables.resume:create_unbold_cv"
generate-outline = "japan_visa_fillables.outline_activities:create_outline_activities_pdf"
generate-all = "japan_visa_fillables:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]